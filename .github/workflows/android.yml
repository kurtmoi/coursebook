name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icons/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the native shell
        run: npm run copy-web

      - name: Add the Android project
        run: npx cap add android

      - name: Generate the app icon and splash screen
        continue-on-error: true
        run: npm run icons

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Coursebook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Coursebook-android
          path: Coursebook.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Coursebook for Android (build ${{ github.run_number }})
          body: |
            Download **Coursebook.apk** on your Android phone and open it to install.
            If Android asks, allow your browser or Files app to install unknown apps.
            Everything you add is saved in the phone's storage and works offline.
          files: Coursebook.apk
